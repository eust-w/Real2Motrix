name: iOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0 or ios-v0.1.0"
        required: true
        type: string
      export_method:
        description: "Xcode export method"
        required: true
        default: "ad-hoc"
        type: choice
        options:
          - development
          - ad-hoc
          - app-store
          - enterprise
      draft:
        description: "Create the GitHub Release as draft"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as prerelease"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "ios-v*"

permissions:
  contents: write

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IOS_PROJECT_DIR: ios/Real2MotrixCapture
  IOS_PROJECT: Real2MotrixCapture.xcodeproj
  IOS_SCHEME: Real2MotrixCapture
  DEFAULT_BUNDLE_IDENTIFIER: local.real2motrix.capture
  EXPORT_METHOD: ${{ github.event.inputs.export_method || 'ad-hoc' }}
  RELEASE_VERSION_INPUT: ${{ github.event.inputs.version || '' }}
  DRAFT_RELEASE: ${{ github.event.inputs.draft || 'false' }}
  PRERELEASE_RELEASE: ${{ github.event.inputs.prerelease || 'false' }}

jobs:
  release:
    name: Build signed IPA and publish release
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_VERSION_INPUT" ]]; then
            VERSION="${RELEASE_VERSION_INPUT#ios-v}"
            TAG_NAME="ios-v${VERSION}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#ios-v}"
          fi
          BUNDLE_IDENTIFIER="${IOS_BUNDLE_IDENTIFIER:-$DEFAULT_BUNDLE_IDENTIFIER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "BUNDLE_IDENTIFIER=$BUNDLE_IDENTIFIER" >> "$GITHUB_ENV"
        env:
          IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}

      - name: Validate signing configuration
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$IOS_TEAM_ID" ]] || missing+=("IOS_TEAM_ID")
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ]] || missing+=("IOS_DISTRIBUTION_CERTIFICATE_BASE64")
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" ]] || missing+=("IOS_DISTRIBUTION_CERTIFICATE_PASSWORD")
          [[ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]] || missing+=("IOS_PROVISIONING_PROFILE_BASE64")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required iOS signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        run: xcodegen generate

      - name: Import signing certificate and provisioning profile
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/ios_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/real2motrix.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/real2motrix-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          CERTIFICATE_PATH="$CERTIFICATE_PATH" PROFILE_PATH="$PROFILE_PATH" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(
              base64.b64decode(os.environ["IOS_DISTRIBUTION_CERTIFICATE_BASE64"])
          )
          Path(os.environ["PROFILE_PATH"]).write_bytes(
              base64.b64decode(os.environ["IOS_PROVISIONING_PROFILE_BASE64"])
          )
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "IOS_TEAM_ID=$IOS_TEAM_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive app
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/Real2MotrixCapture.xcarchive"
          xcodebuild archive \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            archive | tee "$RUNNER_TEMP/ios-release-archive.log"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export signed IPA
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          EXPORT_DIR="$RUNNER_TEMP/export"
          ARTIFACT_DIR="$RUNNER_TEMP/artifacts"
          mkdir -p "$EXPORT_DIR" "$ARTIFACT_DIR"

          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$EXPORT_METHOD</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_IDENTIFIER</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTIONS" | tee "$RUNNER_TEMP/ios-release-export.log"

          IPA_PATH="$(find "$EXPORT_DIR" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "xcodebuild did not produce an IPA" >&2
            exit 1
          fi
          IPA_ASSET="$ARTIFACT_DIR/Real2MotrixCapture-${TAG_NAME}.ipa"
          ARCHIVE_ASSET="$ARTIFACT_DIR/Real2MotrixCapture-${TAG_NAME}.xcarchive.zip"
          cp "$IPA_PATH" "$IPA_ASSET"
          ditto -c -k --sequesterRsrc --keepParent "$ARCHIVE_PATH" "$ARCHIVE_ASSET"

          {
            echo "Real2Motrix iOS release $VERSION"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Bundle identifier: $BUNDLE_IDENTIFIER"
            echo "- Export method: $EXPORT_METHOD"
            echo "- Scheme: $IOS_SCHEME"
          } > "$ARTIFACT_DIR/RELEASE_NOTES.md"

          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> "$GITHUB_ENV"
          echo "IPA_ASSET=$IPA_ASSET" >> "$GITHUB_ENV"
          echo "ARCHIVE_ASSET=$ARCHIVE_ASSET" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=$ARTIFACT_DIR/RELEASE_NOTES.md" >> "$GITHUB_ENV"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ env.TAG_NAME }}
          path: |
            ${{ env.ARTIFACT_DIR }}/*
            ${{ runner.temp }}/ios-release-archive.log
            ${{ runner.temp }}/ios-release-export.log
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=()
          [[ "$DRAFT_RELEASE" == "true" ]] && release_flags+=(--draft)
          [[ "$PRERELEASE_RELEASE" == "true" ]] && release_flags+=(--prerelease)

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$IPA_ASSET" "$ARCHIVE_ASSET" --clobber
            gh release edit "$TAG_NAME" --title "Real2Motrix iOS $VERSION" --notes-file "$RELEASE_NOTES"
          else
            gh release create "$TAG_NAME" \
              "$IPA_ASSET" \
              "$ARCHIVE_ASSET" \
              --target "$GITHUB_SHA" \
              --title "Real2Motrix iOS $VERSION" \
              --notes-file "$RELEASE_NOTES" \
              "${release_flags[@]}"
          fi

      - name: Delete temporary keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
